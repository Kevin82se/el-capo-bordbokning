<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#161310" />
<title>El Capo — Bordbokning</title>
</head>
<body style="margin:0;background:#161310;color:#f3ead8;font-family:Georgia,serif">
<p id="msg" style="padding:28px 20px;font-size:18px">Öppnar El Capo…</p>
<script>
async function start() {
  const bases = [
    "https://raw.githubusercontent.com/Kevin82se/el-capo-bordbokning/ffb489bf34e9281816d563143fb637bcb1c9eca6/",
    "https://cdn.jsdelivr.net/gh/Kevin82se/el-capo-bordbokning@ffb489bf34e9281816d563143fb637bcb1c9eca6/",
    "https://cdn.statically.io/gh/Kevin82se/el-capo-bordbokning/ffb489bf34e9281816d563143fb637bcb1c9eca6/"
  ];
  let last = "";
  for (const base of bases) {
    try {
      const parts = await Promise.all([1,2,3].map(async i => {
        const r = await fetch(base + "p" + i + ".txt");
        if (!r.ok) throw new Error("del " + i);
        return r.text();
      }));
      const b64 = parts.join("").replace(/\s+/g, "");
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const ds = new DecompressionStream("gzip");
      const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
      if (!html.includes("Bordbokning")) throw new Error("fel innehall");
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) { last = e; }
  }
  document.getElementById("msg").textContent = "Kunde inte öppna än. Ladda om sidan. " + last;
}
start();
</script>
</body>
</html>
